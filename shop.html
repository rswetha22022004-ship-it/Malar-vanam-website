<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flower Shop</title>

</head>
<body>

    <!-- Header -->
    <header>


        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header> 

       <header>
        <div class="container">
            <div class="logo">
                <img src="sun logo.jpeg" alt="Malar Vanam Logo">
                <h1>Malar Vanam</h1>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                 <li><a href="shop.html">Shop</a></li> 
                    <li><a href="#" id="cartLink">Cart <span class="cart-count">0</span></a></li>

            </nav>
        </div>

    <!-- Shop Section -->
    <section class="shop">
        <h2>Pick Your Flowers</h2>

        <div class="products">

            <div class="card">
                <img src="red rose.jpeg" alt="Rose">
                <h3>Red Rose</h3>
                <p>₹20/ piece</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="jasmine garlands.jpeg" alt="Jasmine">
                <h3>Jasmine</h3>
                <p>₹100</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="sunflower Bouquet.jpeg" alt="Sunflower">
                <h3>Sun Flower</h3>
                <p>₹80 / piece</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="Bridal Hair Accessory.jpeg" alt="Bridal Hair Accessory">
                <h3>Bridal Hair Accessory</h3>
                <p>₹500</p>
                <button>Add to Cart</button>
            </div>

        </div>
    </section>
